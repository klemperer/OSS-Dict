name: Android CI

on: [push] # 破解分支限制：现在无论你在哪个分支修改代码，只要 push 就会触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      # 将 build 改为 assembleDebug。这会跳过耗时的单元测试，只专心打包 Debug APK，速度更快
      run: ./gradlew assembleDebug 
      
    - name: Upload APK
      # 这一步极其关键：把你编译好的 APK 提取到网页上供你下载
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 注意：绝大多数安卓项目的默认模块名叫 app，所以路径是下面这个。
        # 如果编译成功但找不到文件，可能它的模块名不叫 app，你可以把路径改为 **/*.apk 来模糊抓取
        path: app/build/outputs/apk/debug/app-debug.apk
